- name: Enable EPEL and nbkit for virt-v2v migration
  ansible.builtin.dnf:
    name:
      - epel-release
      - nbdkit
    state: present
    use_backend: dnf4
  when: os_migrate_virt_v2v|default(false)|bool

- name: Make sure required package are installed
  ansible.builtin.dnf:
    name:
      - libvirt
      - virt-v2v
      - qemu-kvm
      - python3
      - python3-pip
      - wget
    state: present
    use_backend: dnf4

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Check virtio-win version
  ansible.builtin.set_fact:
    virtio_version_ok: >-
      {{
        ('virtio-win' in ansible_facts.packages) and
        (ansible_facts.packages['virtio-win'][0].version is version(conversion_host_virtio_version, '>='))
      }}

- name: Check virtio-win version
  os_migrate.vmware_migration_kit.warn:
    msg: "WARNING: The package virtio-win is not installed or the version is lower than {{ conversion_host_virtio_version }}"
  when: not virtio_version_ok

- name: Install openstacksdk
  ansible.builtin.pip:
    name: openstacksdk>1.0.0

- name: Install openstack client
  ansible.builtin.pip:
    name: python-openstackclient
    state: present
  when: os_migrate_virt_v2v|default(false)|bool

# OpenVixDiskLib: pure-Python VDDK replacement served through an nbdkit Python
# plugin. Install the library (from GitHub if missing) and deploy the plugin.
- name: Set up OpenVixDiskLib nbdkit plugin
  when: conversion_host_use_openvixdisklib | bool
  block:
    - name: Install nbdkit and Python plugin packages for OpenVixDiskLib
      ansible.builtin.dnf:
        name:
          - nbdkit
          - nbdkit-python-plugin
          - git
          # Build deps for OpenVixDiskLib's pyfastlz C extension.
          - gcc
          - make
          - python3-devel
        state: present
        use_backend: dnf4

    - name: Determine the conversion host Python version for OpenVixDiskLib
      ansible.builtin.command: >-
        {{ ansible_python_interpreter | default('/usr/bin/python3') }}
        -c 'import sys; print("%d.%d" % sys.version_info[:2])'
      register: openvixdisklib_pyver
      changed_when: false

    - name: Fail early if the conversion host Python is too old for OpenVixDiskLib
      ansible.builtin.fail:
        msg: >-
          OpenVixDiskLib requires Python >= 3.10, but this conversion host provides
          Python {{ openvixdisklib_pyver.stdout }} and nbdkit-python-plugin is bound
          to that interpreter. Use a conversion host based on CentOS Stream 10,
          RHEL 10, or Fedora (Python 3.12), or fall back to the vddk / native
          custom nbdkit plugin.
      when: openvixdisklib_pyver.stdout is version('3.10', '<')

    - name: Check whether OpenVixDiskLib is already installed
      ansible.builtin.command: "{{ ansible_python_interpreter | default('/usr/bin/python3') }} -c 'import openvixdisklib'"
      register: openvixdisklib_check
      changed_when: false
      failed_when: false

    - name: Install OpenVixDiskLib from GitHub when missing
      ansible.builtin.pip:
        name: "git+{{ conversion_host_openvixdisklib_repo }}@{{ conversion_host_openvixdisklib_version }}"
        state: present
      when: openvixdisklib_check.rc != 0

    - name: Ensure the OpenVixDiskLib plugin directory exists
      ansible.builtin.file:
        path: "{{ conversion_host_openvixdisklib_plugin_path | dirname }}"
        state: directory
        mode: "0755"

    - name: Deploy the OpenVixDiskLib nbdkit plugin
      ansible.builtin.copy:
        src: openvixdisklib_nbdkit.py
        dest: "{{ conversion_host_openvixdisklib_plugin_path }}"
        mode: "0644"

# The VMware VIX DiskLib (libdir) is only required for the built-in vddk plugin.
# With a custom native plugin or OpenVixDiskLib it is not needed, so validate the
# custom plugin path instead when one is set.
# The native custom plugin is only validated when OpenVixDiskLib is not enabled,
# since OpenVixDiskLib takes precedence over conversion_host_custom_nbdkit_plugin.
- name: Check if the custom nbdkit plugin exists on the conversion host
  ansible.builtin.stat:
    path: "{{ conversion_host_custom_nbdkit_plugin }}"
  register: custom_nbdkit_plugin_result
  when:
    - not (conversion_host_use_openvixdisklib | bool)
    - conversion_host_custom_nbdkit_plugin | length > 0

- name: Fail if the custom nbdkit plugin does not exist on the conversion host
  ansible.builtin.fail:
    msg: "The custom nbdkit plugin {{ conversion_host_custom_nbdkit_plugin }} does not exist on the conversion host."
  when:
    - not (conversion_host_use_openvixdisklib | bool)
    - conversion_host_custom_nbdkit_plugin | length > 0
    - not custom_nbdkit_plugin_result.stat.exists

- name: Check if libdir is set and exists
  ansible.builtin.stat:
    path: "{{ conversion_host_vmware_lib_dir }}"
  register: libdir_result
  ignore_errors: true
  when: conversion_host_requires_vmware_libdir | bool

- name: Fail if libdir path does not exist on the conversion host
  ansible.builtin.fail:
    msg: "The libdir {{ conversion_host_vmware_lib_dir }} does not exist on the conversion host."
  when:
    - conversion_host_requires_vmware_libdir | bool
    - not libdir_result.stat.exists

- name: Set libdir fact
  ansible.builtin.set_fact:
    libdir: "{{ libdir_result.stat.path }}"
  when: conversion_host_requires_vmware_libdir | bool

- name: Check if virt-v2v-in-place exists in libexec
  ansible.builtin.stat:
    path: /usr/libexec/virt-v2v-in-place
  register: libexec_stat

- name: Check if virt-v2v-in-place is in $PATH
  ansible.builtin.shell: "command -v virt-v2v-in-place || true"
  register: virt_in_path
  changed_when: false

- name: Copy /usr/libexec/virt-v2v-in-place to /usr/bin if not in $PATH
  ansible.builtin.copy:
    src: /usr/libexec/virt-v2v-in-place
    dest: /usr/bin/virt-v2v-in-place
    mode: "0755"
    remote_src: true
  when:
    - libexec_stat.stat.exists
    - virt_in_path.stdout == ""

- name: Create configuration directory .config/openstack
  ansible.builtin.file:
    mode: "0755"
    path: "~/.config/openstack"
    recurse: true
    state: directory

- name: Create os-migrate data dir
  ansible.builtin.file:
    mode: "0755"
    path: "{{ os_migrate_vmw_data_dir }}"
    state: directory
    recurse: true

- name: Set Openstack credentials clouds.yaml file
  ansible.builtin.copy:
    mode: "0600"
    src: "{{ os_migrate_clouds_path|default(os_migrate_vmw_data_dir ~ '/clouds.yaml') }}"
    dest: "~/.config/openstack/clouds.yaml"
  when: copy_openstack_credentials_to_conv_host|default(false)|bool

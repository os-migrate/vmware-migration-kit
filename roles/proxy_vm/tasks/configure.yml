# Turns a blank Fedora / CentOS Stream / RHEL VM into a proxy VM.
#
# Runs ON the proxy VM (inventory group proxy_vm). The vCenter tasks are
# delegated to the controller.
#
# Idempotent: re-run it freely, it only reports a change when something was
# actually missing.

- name: Check the proxy VM settings are defined
  ansible.builtin.assert:
    that:
      - proxy_vm_name | length > 0
      - proxy_vm_allowed_sources | length > 0
    fail_msg: >-
      proxy_vm_name and proxy_vm_allowed_sources (the conversion host
      addresses, as the proxy sees them) are required to configure the proxy.
    quiet: true

- name: Install nbdkit and its file plugin
  become: true
  ansible.builtin.package:
    name: "{{ proxy_vm_packages }}"
    state: present

- name: Configure the nbdkit service
  become: true
  ansible.builtin.copy:
    dest: /etc/sysconfig/osm-nbdkit
    mode: "0644"
    content: |
      # Managed by the os_migrate.vmware_migration_kit proxy_vm role.
      # Address nbdkit binds to: the one the conversion host connects to.
      OSM_NBD_ADDRESS={{ proxy_vm_bind_address }}
      OSM_NBD_PORT={{ proxy_vm_nbd_port }}
  notify: Restart osm-nbdkit

- name: Install the nbdkit service unit
  become: true
  ansible.builtin.copy:
    src: osm-nbdkit.service
    dest: /etc/systemd/system/osm-nbdkit.service
    mode: "0644"
  notify: Restart osm-nbdkit

- name: Enable and start the nbdkit service
  become: true
  ansible.builtin.systemd_service:
    name: osm-nbdkit
    state: started
    enabled: true
    daemon_reload: true

- name: Apply the service configuration before checking it
  ansible.builtin.meta: flush_handlers

# firewall-cmd rather than ansible.posix.firewalld, to avoid adding a
# collection dependency; --query-rich-rule keeps it idempotent.
- name: Open the NBD port for the conversion hosts
  when: proxy_vm_configure_firewall | bool
  block:
    - name: Check firewalld is running
      become: true
      ansible.builtin.command: firewall-cmd --state
      register: proxy_vm_firewalld
      changed_when: false
      failed_when: false

    - name: Add the NBD rules
      when: proxy_vm_firewalld.rc == 0
      become: true
      ansible.builtin.shell:
        cmd: |
          set -eu
          rule='rule family="ipv4" source address={{ item }} port port={{ proxy_vm_nbd_port }} protocol=tcp accept'
          if firewall-cmd --permanent --query-rich-rule="$rule" >/dev/null 2>&1; then
            echo rule-present
          else
            firewall-cmd --permanent --add-rich-rule="$rule" >/dev/null
            firewall-cmd --reload >/dev/null
            echo rule-added
          fi
      register: proxy_vm_firewall_rule
      changed_when: proxy_vm_firewall_rule.stdout == "rule-added"
      loop: "{{ proxy_vm_allowed_sources }}"

    - name: Warn when firewalld is not running
      ansible.builtin.debug:
        msg: >-
          firewalld is not running on {{ inventory_hostname }}: open TCP
          {{ proxy_vm_nbd_port }} for {{ proxy_vm_allowed_sources | join(', ') }}
          yourself. The service exports every disk of this VM read-only to
          whoever can reach that port.
      when: proxy_vm_firewalld.rc != 0

- name: Check the nbdkit service is listening
  ansible.builtin.wait_for:
    host: "{{ proxy_vm_bind_address if proxy_vm_bind_address != '0.0.0.0' else '127.0.0.1' }}"
    port: "{{ proxy_vm_nbd_port | int }}"
    timeout: 30

# disk.EnableUUID=TRUE makes vSphere expose each disk as
# /dev/disk/by-id/wwn-0x<disk uuid>, which is how a hot-added disk is named and
# found. Checking the proxy's own disks is the reliable way to know whether it
# is in effect: the setting only applies after a power cycle.
- name: Look for by-id disk links in the proxy
  ansible.builtin.find:
    paths: /dev/disk/by-id
    patterns: "wwn-0x*"
    file_type: link
  register: proxy_vm_wwn_links

- name: Enable disk UUIDs on the proxy VM
  when: proxy_vm_wwn_links.matched | int == 0
  block:
    - name: Set disk.EnableUUID=TRUE on the proxy VM
      delegate_to: localhost
      become: false
      vmware.vmware.vm_advanced_settings:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ not (proxy_vm_vmware_insecure | bool) }}"
        datacenter: "{{ vcenter_datacenter | default(omit) }}"
        name: "{{ proxy_vm_name }}"
        settings:
          disk.EnableUUID: "TRUE"
        state: present

    - name: Fail if the proxy VM may not be power cycled
      ansible.builtin.fail:
        msg: >-
          disk.EnableUUID was just set on {{ proxy_vm_name }} but only takes
          effect after a power cycle, and proxy_vm_allow_power_cycle is false.
          Power the VM off and on, then run this again.
      when: not (proxy_vm_allow_power_cycle | bool)

    - name: Shut the proxy VM down
      delegate_to: localhost
      become: false
      vmware.vmware.vm_powerstate:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ not (proxy_vm_vmware_insecure | bool) }}"
        datacenter: "{{ vcenter_datacenter | default(omit) }}"
        name: "{{ proxy_vm_name }}"
        state: shutdown-guest

    - name: Power the proxy VM back on
      delegate_to: localhost
      become: false
      vmware.vmware.vm_powerstate:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ not (proxy_vm_vmware_insecure | bool) }}"
        datacenter: "{{ vcenter_datacenter | default(omit) }}"
        name: "{{ proxy_vm_name }}"
        state: powered-on

    - name: Wait for the proxy VM to come back
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 300

    - name: Check the by-id disk links are there now
      ansible.builtin.find:
        paths: /dev/disk/by-id
        patterns: "wwn-0x*"
        file_type: link
      register: proxy_vm_wwn_links_after
      failed_when: proxy_vm_wwn_links_after.matched | int == 0
